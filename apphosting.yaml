runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  maxInstances: 2
  minInstances: 0

env:
  - variable: AI_PROVIDER
    value: mock
  - variable: NEXT_PUBLIC_APP_NAME
    value: "AI Email Threat Detection Platform"
  - variable: NEXT_PUBLIC_APP_VERSION
    value: "1.0.0"
  - variable: MAX_FILE_SIZE
    value: "10485760"
  - variable: NEXT_PUBLIC_ENABLE_DEMO
    value: "true"
  - variable: NEXT_PUBLIC_ENABLE_REPORTS
    value: "true"
  - variable: DATABASE_PATH
    value: "/tmp/email-threat.db"
  - variable: NODE_ENV
    value: "production"
